<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍵盤映射</title>
  <link rel="stylesheet" href="keyboard.css">
</head>
<body>
  <div id="panel">
    <p id="readout" class="idle" aria-live="polite">準備映射</p>
    <div class="toolbar">
      <p id="status">點一下這個畫面，實體按鍵就會亮在下面</p>
      <div class="tools">
        <button type="button" id="layoutFull" aria-pressed="true">全尺寸</button>
        <button type="button" id="layoutTkl" aria-pressed="false">無數字鍵</button>
        <button type="button" id="resetPlace">回到底部</button>
        <button type="button" id="dragHandle">拖曳</button>
      </div>
    </div>
    <div id="board"></div>
  </div>
  <script src="keyboard.js"></script>
</body>
</html>
